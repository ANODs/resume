name: Build resumes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python build_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: output/pdf/*.pdf
